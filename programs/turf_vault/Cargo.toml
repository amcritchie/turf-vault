[package]
name = "turf_vault"
version = "0.24.0"
description = "Solana contest escrow with on-chain currency registry and self-custodial entries"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "turf_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

# v0.15.0: select mainnet USDC/USDT mint constants for the program build.
# Default build (no feature) uses devnet test mints; mainnet binary must
# be built with `--features mainnet` (or `anchor build -- --features mainnet`).
# INIT_AUTHORITY is shared across both — Alex Phantom key is universal.
mainnet = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
# Direct dep for SHA-256 (solana_program::hash::hash) used to derive the
# entry_token PDA from source_ref (v0.19, audit #9). anchor_lang::solana_program
# is a curated facade that omits the `hash` module. Pinned to the same 2.3.x
# already in the tree via anchor — no duplicate version.
solana-program = "2.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
